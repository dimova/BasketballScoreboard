<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
       <div class="container">
    <div class="team">
        <h3 id="home-title" class="team-title">HOME</h3>
        <h2 id="home-score" class="score">0</h2>

        <button onclick="updateScore('home', 1)">+1</button>
        <button onclick="updateScore('home', 2)">+2</button>
        <button onclick="updateScore('home', 3)">+3</button>
    </div>

    <div class="team">
        <h3 id="guest-title" class="team-title">AWAY</h3>
        <h2 id="guest-score" class="score">0</h2>

        <button onclick="updateScore('guest', 1)">+1</button>
        <button onclick="updateScore('guest', 2)">+2</button>
        <button onclick="updateScore('guest', 3)">+3</button>
    </div>
</div>

<h2>Quarter: <span id="quarter">1</span></h2>
<button onclick="nextQuarter()">Next Quarter</button>

<h2>Time Left: <span id="timer">12:00</span></h2>
<button onclick="startTimer()">Start Timer</button>

<br><br>

<button onclick="newGame()">New Game</button>

<h3>Game History</h3>
<ul id="history"></ul>
        <script src="index.js"></script>
    </body>
</html>
